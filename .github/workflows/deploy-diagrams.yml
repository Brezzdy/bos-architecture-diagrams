name: Deploy Architecture Diagrams

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy diagrams
        uses: Brezzdy/declarative-diagram-builder@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: 'BOS Architecture'
          theme-color: '#7c3aed'
          diagrams-dir: 'diagrams'
