<head>
    <meta charset="UTF-8">

    <title>BOS Architecture</title>
    <style>
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: white;
            --text-primary: #333;
            --text-secondary: #666;
            --text-tertiary: #999;

        }
        [data-theme="dark"] {
            --bg-primary: #1e1e1e;

</head>
<body>
    <h1>
        <span>BOS Architecture</span>
        <button class="theme-toggle" onclick="toggleDarkMode()" id="theme-toggle" title="Toggle Dark Mode">🌙</button>
    </h1>
    <p class="subtitle">Browse and explore architecture diagrams</p>
    
    <div class="search-container">
        <input type="text" id="search-box" class="search-box" placeholder="Search diagrams by title..." autocomplete="off">
        <span class="search-icon">&#128269;</span>
    </div>
    
    <div id="search-results" class="search-results-count"></div>
    
    <div id="diagrams-container">
        <div class="loading">Loading diagrams...</div>
    </div>

    <script>
        let allDiagrams = [];
        
        // Dark mode functionality
        function toggleDarkMode() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('diagram-theme', newTheme);
            
            // Update button icon
            const btn = document.getElementById('theme-toggle');
            btn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        }
        
        // Initialize dark mode from localStorage
        (function() {
            const savedTheme = localStorage.getItem('diagram-theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                const btn = document.getElementById('theme-toggle');
                if (btn) btn.textContent = '☀️';
            }
        })();
        
        function filterDiagrams(searchTerm) {
            const resultsDiv = document.getElementById('search-results');
            
            if (!searchTerm) {
                renderDiagrams(allDiagrams);
                resultsDiv.textContent = '';
                return;
            }
            
            const filtered = allDiagrams.filter(diagram => 
                diagram.title.toLowerCase().includes(searchTerm.toLowerCase())
            );
            
            renderDiagrams(filtered);
            resultsDiv.textContent = 'Found ' + filtered.length + ' diagram' + (filtered.length !== 1 ? 's' : '');
        }
        
        function renderDiagrams(diagrams) {
            const container = document.getElementById('diagrams-container');
            
            if (diagrams.length === 0) {
                container.innerHTML = '<div class="loading">No diagrams found matching your search.</div>';
                return;
            }
            
            // Group diagrams by category
            const categories = {};
            diagrams.forEach(diagram => {
                const category = diagram.category || 'General';
                if (!categories[category]) {
                    categories[category] = [];
                }
                categories[category].push(diagram);
            });
            
            container.innerHTML = '';
            
            // Render each category
            Object.keys(categories).sort().forEach(categoryName => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                
                const categoryTitle = document.createElement('h2');
                categoryTitle.className = 'category-title';
                categoryTitle.textContent = categoryName.charAt(0).toUpperCase() + categoryName.slice(1);
                categoryDiv.appendChild(categoryTitle);
                
                const diagramList = document.createElement('div');
                diagramList.className = 'diagram-list';
                
                categories[categoryName].forEach(diagram => {
                    const card = document.createElement('a');
                    card.href = diagram.id + '.html';
                    card.className = 'diagram-card';
                    
                    const h3 = document.createElement('h3');
                    h3.textContent = diagram.title;
                    card.appendChild(h3);
                    
                    // Add version info if available
                    if (diagram.git) {
                        const versionInfo = document.createElement('div');
                        versionInfo.className = 'card-version-info';
                        
                        const versionBadge = document.createElement('span');
                        versionBadge.className = 'version-badge-small';
                        versionBadge.textContent = diagram.git.totalVersions + ' version' + (diagram.git.totalVersions > 1 ? 's' : '');
                        versionInfo.appendChild(versionBadge);
                        
                        const versionDate = document.createElement('span');
                        versionDate.className = 'version-date-small';
                        versionDate.textContent = 'Updated ' + diagram.git.relativeTime;
                        versionInfo.appendChild(versionDate);
                        
                        card.appendChild(versionInfo);
                    }
                    
                    const p = document.createElement('p');
                    p.textContent = 'View diagram \u2192';
                    card.appendChild(p);
                    
                    diagramList.appendChild(card);
                });
                
                categoryDiv.appendChild(diagramList);
                container.appendChild(categoryDiv);
            });
        }
        
        async function loadDiagramsList() {
            const container = document.getElementById('diagrams-container');
            
            try {
                const response = await fetch('diagrams-list.json');
                allDiagrams = await response.json();
                renderDiagrams(allDiagrams);
                
                // Setup search
                const searchBox = document.getElementById('search-box');
                searchBox.addEventListener('input', (e) => {
                    filterDiagrams(e.target.value);
                });
            } catch (error) {
                console.error('Error loading diagrams list:', error);
                container.innerHTML = '<div class="loading" style="color: red;">Error loading diagrams list</div>';
            }
        }

        loadDiagramsList();
    </script>
</body>
</html>
